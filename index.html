<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EEF2E6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121E19" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Geo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<title>Geo-Kasten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Lexend:wght@400;500;600&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<style>
  /* Layout: eine schmale Spalte wie eine Buchseite. Fortschritt oben, grosse Tippflaechen, Aktionen unten. */
  :root {
    --bg: #EEF2E6;
    --surface: #FFFFFF;
    --ink: #1B2E24;
    --muted: #5C6F63;
    --line: #D3DEC9;
    --accent: #2F7D4F;
    --on-accent: #FFFFFF;
    --accent-soft: #DCEBD3;
    --tip: #F3DDAE;
    --on-tip: #4A3410;
    --good: #1F7A4D;
    --on-good: #FFFFFF;
    --good-bg: #DDF1E5;
    --bad: #B4412F;
    --bad-bg: #F8E0DB;
    --sea: #CFE6F0;
    --land: #EADFB9;
    --ctx: #D9D9CE;
    --edge: #FFFFFF;
    --hi: #F2A900;
    --display: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
    --body: 'Lexend', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121E19; --surface: #1A2B23; --ink: #E5F0E8; --muted: #9DB5A5; --line: #2C4538;
      --accent: #6CCB8E; --on-accent: #0A2216; --accent-soft: #21382B;
      --tip: #4B3C1C; --on-tip: #F2DFB4;
      --good: #6BCB93; --on-good: #08241A; --good-bg: #1A3A2A;
      --bad: #F0907F; --bad-bg: #432622;
      --sea: #17384A; --land: #5B5436; --ctx: #3A4540; --edge: #1A2B23; --hi: #F2B01E;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121E19; --surface: #1A2B23; --ink: #E5F0E8; --muted: #9DB5A5; --line: #2C4538;
    --accent: #6CCB8E; --on-accent: #0A2216; --accent-soft: #21382B;
    --tip: #4B3C1C; --on-tip: #F2DFB4;
    --good: #6BCB93; --on-good: #08241A; --good-bg: #1A3A2A;
    --bad: #F0907F; --bad-bg: #432622;
    --sea: #17384A; --land: #5B5436; --ctx: #3A4540; --edge: #1A2B23; --hi: #F2B01E;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--body); font-size: 16px; line-height: 1.45;
    padding-inline: 16px; padding-block: 14px;
    -webkit-text-size-adjust: 100%;
  }
  #app { max-width: 560px; margin-inline: auto; min-height: 100%; display: flex; flex-direction: column; gap: 16px; }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .small { font-size: .875rem; }

  /* Buttons */
  .btn {
    min-height: 56px; border-radius: 16px; border: 2px solid transparent;
    font-weight: 600; font-size: 1.05rem; padding: 0 20px; width: 100%;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .btn:active { transform: scale(.98); }
  .btn.primary { background: var(--accent); color: var(--on-accent); }
  .btn.ghost { background: transparent; border-color: var(--line); color: var(--ink); }
  .btn.warm { background: var(--tip); color: var(--on-tip); }
  .btn.good { background: var(--good); color: var(--on-good); }
  .btn.link { background: none; min-height: 44px; width: auto; color: var(--muted); font-size: .95rem; text-decoration: underline; text-underline-offset: 3px; }
  .btn.sm { min-height: 44px; font-size: .95rem; width: auto; padding: 0 16px; }
  .btn[disabled] { opacity: .5; cursor: default; }
  .actions { display: grid; gap: 12px; margin-top: auto; padding-top: 8px; }
  .actions.two { grid-template-columns: 1fr 1fr; }
  .icon-btn { width: 48px; height: 48px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }

  /* Karten */
  .card { background: var(--surface); border: 2px solid var(--line); border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .card.tight { padding: 14px 16px; gap: 8px; }
  .tag { align-self: flex-start; background: var(--tip); color: var(--on-tip); font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; }
  .label { color: var(--muted); font-size: .9rem; }
  .big { font-family: var(--display); font-weight: 800; font-size: clamp(2rem, 10vw, 3rem); line-height: 1.1; overflow-wrap: anywhere; text-wrap: balance; }
  .big.long { font-size: clamp(1.5rem, 7vw, 2rem); }
  .q { font-family: var(--display); font-weight: 800; font-size: clamp(1.4rem, 6vw, 1.85rem); line-height: 1.2; overflow-wrap: anywhere; text-wrap: balance; }
  .ans-big { font-family: var(--display); font-weight: 700; font-size: clamp(1.25rem, 5.4vw, 1.6rem); line-height: 1.25; overflow-wrap: anywhere; }
  .ex { background: var(--tip); color: var(--on-tip); border-radius: 14px; padding: 12px 14px; }
  .ex b { display: block; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 2px; font-weight: 600; }
  .stage { flex: 1; display: flex; flex-direction: column; gap: 14px; }

  /* Kopf */
  .topbtns { display: flex; align-items: center; gap: 8px; }
  .topbtns .icon-btn { position: relative; width: 44px; height: 44px; color: var(--accent); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .shead { display: flex; align-items: center; gap: 12px; }
  .bar, .meter { flex: 1; height: 12px; border-radius: 8px; background: var(--line); overflow: hidden; }
  .bar span, .meter span { display: block; height: 100%; background: var(--accent); border-radius: 8px; transition: width .25s ease; }
  .count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .9rem; min-width: 3ch; text-align: right; }
  .note { background: var(--accent-soft); border-radius: 12px; padding: 8px 12px; font-size: .875rem; }

  /* Start */
  .brand h1 { font-size: 2.4rem; font-weight: 800; line-height: 1; }
  .brand p { color: var(--muted); margin-top: 4px; }
  .pick { display: grid; gap: 12px; }
  .who { display: flex; align-items: center; gap: 16px; text-align: left; min-height: 84px; padding: 14px 16px; border: 2px solid var(--line); border-radius: 20px; background: var(--surface); width: 100%; }
  .avatar { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 1.6rem; flex: none; }
  .avatar.a { background: var(--accent); color: var(--on-accent); }
  .avatar.b { background: var(--tip); color: var(--on-tip); }
  .who strong { font-family: var(--display); font-size: 1.35rem; display: block; line-height: 1.15; }

  .stats { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
  .hero { text-align: center; display: grid; justify-items: center; gap: 2px; padding: 20px 16px 16px; --fl: var(--muted); }
  .hero.t1 { --fl: #E8821E; }
  .hero.t2 { --fl: #F2A900; }
  .hero .flame { color: var(--fl); line-height: 0; }
  .hero.t0 .flame { opacity: .45; }
  .hero .num { font-family: var(--display); font-weight: 800; font-size: 4.6rem; line-height: .95; color: var(--ink); font-variant-numeric: tabular-nums; margin-top: 2px; }
  .hero .lbl { font-family: var(--display); font-weight: 700; font-size: 1.25rem; }
  .hero .rec { color: var(--muted); font-size: .9rem; margin-bottom: 10px; }
  .hero .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; width: 100%; max-width: 340px; margin: 4px 0 8px; }
  .wd { display: grid; justify-items: center; gap: 4px; }
  .wd i { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--line); color: var(--muted); }
  .wd i svg { width: 18px; height: 18px; }
  .wd span { font-size: .75rem; color: var(--muted); }
  .wd.ok i { background: #E8821E; border-color: #E8821E; color: #3A2000; }
  .hero.t2 .wd.ok i { background: #F2A900; border-color: #F2A900; }
  .wd.frei i { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .wd.now i { border: 2px dashed #E8821E; }
  .wd.miss i { opacity: .5; }
  .wd.future i { border-style: dotted; opacity: .6; }
  .wd.today span { color: var(--ink); font-weight: 700; }
  @media (prefers-reduced-motion: no-preference) { .hero.t1 .flame svg, .hero.t2 .flame svg { animation: flick 2.4s ease-in-out infinite; transform-origin: 50% 90%; } }
  @keyframes flick { 0%, 100% { transform: scale(1) rotate(0); } 40% { transform: scale(1.06) rotate(-2deg); } 70% { transform: scale(.98) rotate(1.5deg); } }
  .pet { display: grid; justify-items: center; }
  .hero .lbl { display: flex; align-items: center; gap: 6px; }
  .lbl svg { color: var(--fl); }
  .grow { display: grid; gap: 8px; }
  .grow .bar { height: 12px; border-radius: 99px; background: var(--accent-soft); overflow: hidden; }
  .grow .bar span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
  .petrow { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .petcard { display: grid; justify-items: center; gap: 2px; padding: 12px 8px; border: 2px solid var(--line); border-radius: 20px; background: var(--surface); font-family: var(--display); font-size: 1.2rem; font-weight: 700; }
  .petcard[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .ladder { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; text-align: center; }
  .ladder figure { margin: 0; display: grid; justify-items: center; }
  .ladder figcaption { font-size: .72rem; color: var(--muted); }
  .ladder .locked svg { filter: brightness(0) opacity(.28); }
  .lvl { text-align: center; display: grid; justify-items: center; gap: 6px; border-color: #F2B01E; }
  .goal { display: grid; gap: 6px; min-width: 0; grid-column: 1 / -1; }
  .goal p { font-size: .9rem; }

  .modes { display: grid; gap: 12px; }
  .mode { display: grid; grid-template-columns: 48px 1fr; gap: 14px; align-items: center; text-align: left; padding: 14px 16px; min-height: 76px; background: var(--surface); border: 2px solid var(--line); border-radius: 20px; width: 100%; }
  .mode:active { transform: scale(.98); }
  .mode .ic { width: 48px; height: 48px; border-radius: 14px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
  .mode strong { font-family: var(--display); font-size: 1.25rem; display: block; line-height: 1.15; }
  .mode span.d { color: var(--muted); font-size: .875rem; }
  .mode[disabled] { opacity: .45; cursor: default; }
  .mode[disabled]:active { transform: none; }

  .trays { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; align-items: end; }
  .tray { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
  .well { width: 100%; border: 2px solid var(--line); border-top: none; border-radius: 0 0 12px 12px; background: var(--accent-soft); display: flex; justify-content: center; padding-top: 6px; font-family: var(--display); font-weight: 800; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
  .tray.new .well { background: var(--tip); color: var(--on-tip); border-style: dashed; border-top: none; }
  .tl { font-size: .75rem; font-weight: 600; }
  .ti { font-size: .7rem; color: var(--muted); text-align: center; line-height: 1.15; }

  /* Fragen und Antworten */
  .input { width: 100%; min-height: 58px; border: 2px solid var(--line); border-radius: 16px; padding: 0 16px; font: 500 1.25rem var(--body); background: var(--surface); color: var(--ink); }
  .input:focus { border-color: var(--accent); }
  .fb { border-radius: 16px; padding: 14px 16px; display: grid; gap: 4px; }
  .fb.good { background: var(--good-bg); color: var(--good); }
  .fb.bad { background: var(--bad-bg); color: var(--bad); }
  .fb strong { font-family: var(--display); font-size: 1.3rem; display: flex; align-items: center; gap: 8px; }
  .fb .ans { color: var(--ink); font-weight: 500; font-size: 1.05rem; }
  .opts { display: grid; gap: 10px; }
  .opt { text-align: left; min-height: 58px; padding: 12px 16px; border: 2px solid var(--line); border-radius: 16px; background: var(--surface); font-size: 1.02rem; font-weight: 500; width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; overflow-wrap: anywhere; }
  .opt:active { transform: scale(.98); }
  .opt.ok { border-color: var(--good); background: var(--good-bg); }
  .opt.no { border-color: var(--bad); background: var(--bad-bg); }
  .opt:disabled { cursor: default; transform: none; }
  .center { text-align: center; }

  /* Landkarten */
  .mapbox { background: var(--sea); border: 2px solid var(--line); border-radius: 18px; overflow: hidden; line-height: 0; }
  .map { width: 100%; height: auto; max-height: 54vh; display: block; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  .map.short { max-height: 36vh; }
  .map .ctx { fill: var(--ctx); stroke: var(--edge); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .map .rg { fill: var(--land); stroke: var(--edge); stroke-width: 1.2; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  .map.tapping .rg { cursor: pointer; }
  .map.world .rg { fill: var(--c); stroke: var(--c); stroke-width: 1; }
  .map.world .rg.c-europa { --c: #E8A9A0; } .map.world .rg.c-asien { --c: #F1DE8B; } .map.world .rg.c-afrika { --c: #9FD3CF; }
  .map.world .rg.c-nordamerika { --c: #A9D4A0; } .map.world .rg.c-suedamerika { --c: #C7B7E3; } .map.world .rg.c-australien { --c: #F2B77E; } .map.world .rg.c-antarktis { --c: #E6EEF2; }
  :root[data-theme="dark"] .map.world .rg.c-europa { --c: #8C5A52; } :root[data-theme="dark"] .map.world .rg.c-asien { --c: #8A7A3A; } :root[data-theme="dark"] .map.world .rg.c-afrika { --c: #3F7F7B; }
  :root[data-theme="dark"] .map.world .rg.c-nordamerika { --c: #4E7F4A; } :root[data-theme="dark"] .map.world .rg.c-suedamerika { --c: #6C5B8A; } :root[data-theme="dark"] .map.world .rg.c-australien { --c: #8F6A3E; } :root[data-theme="dark"] .map.world .rg.c-antarktis { --c: #5C7480; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .map.world .rg.c-europa { --c: #8C5A52; } :root:not([data-theme="light"]) .map.world .rg.c-asien { --c: #8A7A3A; } :root:not([data-theme="light"]) .map.world .rg.c-afrika { --c: #3F7F7B; }
    :root:not([data-theme="light"]) .map.world .rg.c-nordamerika { --c: #4E7F4A; } :root:not([data-theme="light"]) .map.world .rg.c-suedamerika { --c: #6C5B8A; } :root:not([data-theme="light"]) .map.world .rg.c-australien { --c: #8F6A3E; } :root:not([data-theme="light"]) .map.world .rg.c-antarktis { --c: #5C7480; }
  }
  .map.world .rg.hi { --c: var(--hi) !important; } .map.world .rg.ok { --c: var(--good) !important; } .map.world .rg.no { --c: var(--bad) !important; }
  .map .rg.hi { fill: var(--hi); }
  .map .rg.hi { stroke: var(--ink); stroke-width: 2.5; vector-effect: non-scaling-stroke; }
  .map.world .rg.hi { stroke: var(--hi); stroke-width: 1.5; filter: drop-shadow(0 0 3px var(--ink)); }
  .map.focus .rg:not(.hi):not(.ok):not(.no) { opacity: .38; }
  @media (prefers-reduced-motion: no-preference) { .map.focus .rg.hi { animation: hiblink 1.1s ease-in-out infinite; } }
  @keyframes hiblink { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
  .sw { display: inline-block; width: .85em; height: .85em; border-radius: 50%; background: var(--hi); border: 2px solid var(--ink); vertical-align: -.05em; margin: 0 .15em; }
  .map .rg.ok { fill: var(--good); }
  .map .rg.no { fill: var(--bad); }
  .map .ring { fill: none; stroke: var(--hi); stroke-width: 3; vector-effect: non-scaling-stroke; }
  .map .dot { fill: var(--hi); stroke: var(--ink); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  @media (prefers-reduced-motion: no-preference) { .map .ring.pulse { animation: ringp 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } }
  @keyframes ringp { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.18); opacity: .7; } }

  /* Ergebnis */
  .result { align-items: center; text-align: center; padding-block: 28px; }
  .stars { display: flex; gap: 8px; color: var(--tip); }
  .stars svg { width: 56px; height: 56px; }
  .stars .on { color: #E0A82E; animation: pop .4s ease backwards; }
  .stars .on:nth-child(2) { animation-delay: .12s; }
  .stars .on:nth-child(3) { animation-delay: .24s; }
  @keyframes pop { from { transform: scale(.3) rotate(-20deg); opacity: 0; } to { transform: none; opacity: 1; } }

  /* Eltern */
  .sec { display: grid; gap: 12px; }
  .sec h2 { font-size: 1.35rem; }
  .field { display: grid; gap: 6px; }
  .field label { font-size: .875rem; font-weight: 500; }
  .field .input { font-size: 1rem; min-height: 50px; }
  .list { display: grid; gap: 0; border: 2px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--surface); }
  .li { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); min-width: 0; }
  .li:first-child { border-top: none; }
  .li div { min-width: 0; overflow-wrap: anywhere; }
  .li b { font-weight: 600; }
  .li .de { color: var(--muted); font-size: .9rem; }
  details.fold { border: 2px solid var(--line); border-radius: 16px; background: var(--surface); overflow: hidden; }
  details.fold > summary { min-height: 48px; padding: 10px 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; }
  details.fold .list { border: none; border-top: 1px solid var(--line); border-radius: 0; }
  .switch { display: flex; align-items: center; gap: 12px; min-height: 48px; }
  .switch input { width: 24px; height: 24px; accent-color: var(--accent); flex: none; }
  .chaps { display: grid; gap: 2px; margin: 6px 0 4px; }
  .chap { min-height: 52px; font-weight: 600; }
  .grp { font-family: var(--display); font-weight: 700; font-size: 1rem; color: var(--muted); margin-top: 6px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    .btn:active, .mode:active, .opt:active { transform: none; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  'use strict';
/* Eigene Maskottchen: Fuchs, Eule, Drache, Katze. Stufen 0-2, Stimmungen 'ruhig' | 'jubel' | 'trost'. */
var TIERE = (function () {
  var INK = '#1E2B30';
  function eye(x, y, mood, r) {
    r = r || 3.6;
    if (mood === 'jubel') return '<path d="M' + (x - 4.2) + ' ' + (y + 1.5) + ' Q' + x + ' ' + (y - 5.5) + ' ' + (x + 4.2) + ' ' + (y + 1.5) + '" fill="none" stroke="' + INK + '" stroke-width="2.6" stroke-linecap="round"/>';
    return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + INK + '"/><circle cx="' + (x + 1.2) + '" cy="' + (y - 1.3) + '" r="1.2" fill="#fff"/>';
  }
  function brow(x, y, side, mood) { // side: -1 links, 1 rechts
    if (mood !== 'trost') return '';

    M.regions.forEach(function (r) {
      var cls = 'rg' + (mk === 'world' ? ' c-' + r.id.slice(2) : '') + (o.marks && o.marks[r.id] ? ' ' + o.marks[r.id] : '');
      h += '<path class="' + cls + '"' + (o.tap ? ' data-a="map-tap" data-id="' + r.id + '"' : '') + ' d="' + r.d + '"/>';
    });
    if (o.ring) {
      var rr = M.regions.filter(function (x) { return x.id === o.ring; })[0];
      if (rr) h += '<circle class="ring pulse" cx="' + rr.cx + '" cy="' + rr.cy + '" r="' + rr.r + '"/>';
    }
    if (o.pin) h += '<circle class="ring pulse" cx="' + o.pin.x + '" cy="' + o.pin.y + '" r="34"/><circle class="dot" cx="' + o.pin.x + '" cy="' + o.pin.y + '" r="7"/>';
    return h + '</svg></div>';
  }

  function curKind(s) { return s.q[s.i].kind; }
  function optsHtml(e, s) {
    var done = s.phase === 'result';
    return '<div class="opts" role="group" aria-label="Antworten">' + e.opts.map(function (o, i) {
      var cls = '', ic = '';
      if (done) {
        if (o.ok) { cls = ' ok'; ic = '<span style="color:var(--good)">' + ICON.check + '</span>'; }
        else if (s.res.idx === i) { cls = ' no'; ic = '<span style="color:var(--bad)">' + ICON.cross + '</span>'; }
      }
      return '<button class="opt' + cls + '" data-a="pick-opt" data-i="' + i + '"' + (done ? ' disabled' : '') + '><span>' + esc(o.t) + '</span>' + ic + '</button>';
    }).join('') + '</div>';
  }

  function vSession() {
    var s = session, e = s.q[s.i], it = e.it, kind = e.kind, pct = Math.round(s.i / s.q.length * 100);
    var head = '<div class="shead"><button class="icon-btn" data-a="quit" aria-label="Beenden">' + ICON.back + '</button>' +
      '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><span style="width:' + pct + '%"></span></div>' +
      '<span class="count">' + (s.i + 1) + '/' + s.q.length + '</span></div>' +
      (s.test ? '<p class="note">Mini-Test · ohne Hilfen, zählt nicht für den Fortschritt</p>' : s.practice ? '<p class="note">Übungsrunde · zählt nicht für die Serie</p>' : '');
    var tag = '<span class="tag">' + esc(it.tagLabel) + '</span>', body = '';
    var done = s.phase === 'result';
    var next = '<div class="actions"><button class="btn primary" data-a="next">Weiter</button></div>';

    if (kind === 'cards') {
      if (s.phase === 'front') {
        body = '<div class="stage"><section class="card">' + tag + '<div class="q">' + esc(it.q) + '</div></section>' +
          '<p class="muted center">Weißt du die Antwort?</p></div>' +
          '<div class="actions"><button class="btn primary" data-a="flip">Umdrehen</button></div>';
      } else {
        body = '<div class="stage"><section class="card">' + tag + '<p class="label">' + esc(it.q) + '</p>' +
          '<div class="ans-big">' + esc(it.a) + '</div></section></div>' +
          '<div class="actions two"><button class="btn warm" data-a="again">Nochmal</button><button class="btn good" data-a="know">Gewusst</button></div>';
      }
    } else if (kind === 'quiz') {
      body = '<div class="stage"><section class="card tight">' + tag + '<div class="q">' + esc(it.q) + '</div></section>' + optsHtml(e, s) + '</div>' + (done ? next : '');
    } else if (kind === 'tap') {
      var marks = {}, fb = '';
      if (done) {
        marks[it.id] = 'ok';
        var ok = s.res.id === it.id;
        if (!ok) marks[s.res.id] = 'no';
        fb = ok ? '<div class="fb good" role="status"><strong>' + ICON.check + 'Richtig!</strong></div>'
          : '<div class="fb bad" role="status"><strong>' + ICON.cross + 'Das war ' + esc(regionName(it.map, s.res.id)) + '.</strong><span class="ans">Gesucht war <b>' + esc(it.name) + '</b> (grün).</span></div>';
      }
      body = '<div class="stage"><section class="card tight">' + tag + '<p class="label">Tippe auf der Karte auf:</p><div class="big long">' + esc(it.name) + '</div></section>' +
        mapSvg(it.map, { tap: !done, marks: marks, short: done }) + fb + '</div>' + (done ? next : '');
    } else {
      var marks2 = {};
      var rid = it.rid || it.id;
      if (!it.pin) marks2[rid] = 'hi';
      var reg = it.pin ? null : MD[it.map].regions.filter(function (r) { return r.id === rid; })[0];
      var ringId = (reg && reg.small) ? rid : null;
      var set = SETBY[it.set];
      body = '<div class="stage"><section class="card tight">' + tag + '<p class="label">' + (it.isCap ? 'Wie heißt die Hauptstadt von <b>' + esc(it.name) + '</b>? <span class="muted small">(<span class="sw"></span> orange auf der Karte)</span>' : it.pin ? 'Wie heißt der Ozean an der <span class="sw"></span> <b>orangen Markierung</b>?' : 'Wie heißt ' + ({ Kontinent: 'der', Land: 'das', Bundesland: 'das' }[set.noun] || 'der') + ' <span class="sw"></span> <b>orange blinkende</b> ' + set.noun + '?') + '</p></section>' +
        mapSvg(it.map, { focus: !it.pin, marks: marks2, ring: ringId, pin: it.pin ? { x: it.x, y: it.y } : null, short: true }) + optsHtml(e, s) + '</div>' + (done ? next : '');
    }
    return head + body;
  }

  function wrongLabel(it) { return it.isCap ? '<b>' + esc(it.name) + '</b><div class="de">Hauptstadt: ' + esc(it.cap) + '</div>' : it.type === 'term' ? '<b>' + esc(it.q) + '</b><div class="de">' + esc(it.a) + '</div>' : '<b>' + esc(it.name) + '</b><div class="de">' + esc(it.tagLabel) + '</div>'; }
  function vTestResult() {
    var s = session, ratio = s.total ? s.right / s.total : 0;
    var txt = ratio >= 0.9 ? 'Sehr stark!' : ratio >= 0.7 ? 'Gut gemacht!' : ratio >= 0.5 ? 'Schon ordentlich, da geht mehr.' : 'Noch etwas üben, dann klappt es.';
    var wrong = s.wrong.length
      ? '<section class="card"><h3 style="font-size:1.15rem">Das üben wir noch</h3><div class="list">' + s.wrong.map(function (it) {
          return '<div class="li"><div>' + wrongLabel(it) + '</div><span></span></div>';
        }).join('') + '</div></section>'
      : '<p class="center"><b>Kein einziger Fehler!</b></p>';
    return '<div class="stage"><section class="card result"><span class="tag">Mini-Test</span><h2 style="font-size:1.9rem">' + s.right + ' von ' + s.total + ' richtig</h2>' +
      '<p>' + txt + '</p><p class="muted small">Der Test ändert deinen Kasten nicht.</p></section>' + wrong + '</div>' +
      '<div class="actions"><button class="btn primary" data-a="start-test">Neuer Mini-Test</button><button class="btn ghost" data-a="quit">Fertig</button></div>';
  }

  function vResult() {
    if (session && session.test) return vTestResult();
    var s = session, p = profile(), P = prog(), today = P.days[dayKey(new Date())] || 0;
    var ratio = s.total ? s.right / s.total : 0;
    var stars = ratio >= 0.9 ? 3 : ratio >= 0.7 ? 2 : 1;
    var txt = stars === 3 ? 'Super gemacht!' : stars === 2 ? 'Gut gemacht!' : 'Dranbleiben, das wird!';
    var sv = '';
    for (var i = 1; i <= 3; i++) sv += '<span class="' + (i <= stars ? 'on' : '') + '">' + ICON.star + '</span>';
    var st = streak();
    var extra = s.practice
      ? '<p class="muted">Übungsrunde: Sie zählt nicht für Fortschritt und Serie.</p>'
      : '<p class="muted">Heute: <b>' + Math.min(today, GOAL) + ' von ' + GOAL + '</b> Aufgaben' + (st > 0 ? ' · ' + st + (st === 1 ? ' Tag' : ' Tage') + ' in Folge' : '') + '</p>';
    var petBit = P.pet ? '<div class="pet">' + petArt(110, stars >= 2 ? 'jubel' : 'ruhig') + '</div>' : '';
    return '<div class="stage">' + (levelUpPending() ? levelUpHtml() : '') + '<section class="card result">' + petBit + '<div class="stars" aria-hidden="true">' + sv + '</div>' +
      '<h2 style="font-size:1.9rem">' + txt + '</h2>' +
      '<p><b>' + s.right + ' von ' + s.total + '</b> gleich gewusst, ' + esc(p.name) + '.</p>' + extra + '</section></div>' +
      '<div class="actions"><button class="btn primary" data-a="start" data-m="' + s.mode + '">Noch eine Runde</button>' +
      '<button class="btn ghost" data-a="quit">Fertig</button></div>';
  }

  function vGate() {
    return '<div class="shead"><button class="icon-btn" data-a="quit" aria-label="Zurück">' + ICON.back + '</button><h1 style="font-size:1.7rem">Für Eltern</h1></div>' +
      '<section class="card"><p>Kurze Rechenaufgabe für Erwachsene:</p><div class="big">' + gate.a + ' × ' + gate.b + ' = ?</div>' +
      '<form id="gateForm" class="field" autocomplete="off"><label for="gateAns" class="sr">Ergebnis</label>' +
      '<input id="gateAns" class="input" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" autocomplete="off">' +
      (gateMsg ? '<p class="muted small" role="status">' + esc(gateMsg) + '</p>' : '') +
      '</form></section><div class="actions"><button class="btn primary" data-a="gate-ok">Weiter</button></div>';
  }

  function vParents() {
    var names = DB.profiles.map(function (p) {
      return '<div class="field"><label for="n-' + esc(p.id) + '">Name</label><input id="n-' + esc(p.id) + '" class="input" data-name="' + esc(p.id) + '" value="' + esc(p.name) + '" maxlength="20"></div>';
    }).join('');
    var dev = DB.profiles.map(function (p) {
      return '<button class="btn ' + (DB.device === p.id ? 'primary' : 'ghost') + ' sm" data-a="set-device" data-id="' + esc(p.id) + '" style="width:100%">' + esc(p.name) + (DB.device === p.id ? ' (aktuell)' : '') + '</button>';
    }).join('');
    var folds = CH.filter(function (c) { return !HIDDEN[c.key]; }).map(function (c) {
      return '<details class="fold"><summary>' + esc(c.label) + ' (' + c.cards.length + ')</summary><div class="list">' + c.cards.map(function (t) {
        return '<div class="li"><div><b>' + esc(t.q) + '</b><div class="de">' + esc(t.a) + '</div></div><span></span></div>';
      }).join('') + '</div></details>';
    }).join('');
    var maps = '<div class="list">' + SETS.filter(function (s) { return !HIDDEN[s.key]; }).map(function (s) {
      return '<div class="li"><div><b>' + esc(s.label) + '</b><div class="de">' + s.items.map(function (i) { return esc(i.name); }).join(', ') + '</div></div><span></span></div>';
    }).join('') + '</div>';
    var resets = DB.profiles.map(function (p) {
      if (resetFor === p.id) {
        return '<div class="fb bad"><strong>Fortschritt von ' + esc(p.name) + ' löschen?</strong><span class="ans">Das lässt sich nicht rückgängig machen.</span>' +
          '<div class="actions two" style="margin-top:8px"><button class="btn ghost sm" data-a="reset-no" style="width:100%">Abbrechen</button><button class="btn warm sm" data-a="reset-yes" data-id="' + esc(p.id) + '" style="width:100%">Löschen</button></div></div>';
      }
      return '<button class="btn ghost sm" data-a="reset" data-id="' + esc(p.id) + '" style="width:100%">Fortschritt von ' + esc(p.name) + ' zurücksetzen</button>';
    }).join('');
    return '<div class="shead"><button class="icon-btn" data-a="quit" aria-label="Zurück">' + ICON.back + '</button><h1 style="font-size:1.7rem">Für Eltern</h1></div>' +
      '<p class="note">Erste Version. Die Begriffe sind ein Startpaket und noch nicht mit dem Buch abgeglichen. Der Fortschritt wird nur auf diesem Gerät gespeichert.</p>' +
      '<section class="sec"><h2>Namen</h2>' + names + '</section>' +
      '<section class="sec"><h2>Dieses Gerät gehört</h2>' + dev + '</section>' +
      '<section class="sec"><h2>Töne</h2><label class="switch"><input type="checkbox" id="sndToggle"' + (soundOn() ? ' checked' : '') + '><span>Töne bei Antworten und Belohnungen</span></label></section>' +
      '<section class="sec"><h2>Begriffe (' + TERMS.filter(function (t) { return !HIDDEN[t.ch]; }).length + ')</h2>' + folds + '</section>' +
      '<section class="sec"><h2>Landkarten (' + MAPITEMS.filter(function (m) { return !HIDDEN[m.set]; }).length + ')</h2>' + maps + '</section>' +
      '<section class="sec"><h2>Fortschritt</h2>' + resets + '</section>';
  }

  /* ---------- Rendern ---------- */
  function render() {
    var app = $('#app'), h;
    if (view === 'profiles') h = vProfiles();
    else if (view === 'pet') h = vPet();
    else if (view === 'home') h = vHome();
    else if (view === 'session') h = vSession();
    else if (view === 'result') h = vResult();
    else if (view === 'gate') h = vGate();
    else h = vParents();
    app.innerHTML = h;
    try { window.scrollTo(0, 0); } catch (e) {}
    if ((view === 'result' || view === 'home') && levelUpPending() && lvlSoundFor !== petStage()) { lvlSoundFor = petStage(); sfx('level'); }
    else if (view === 'result' && session && !session.sfxDone) {
      session.sfxDone = true;
      var rt = session.total ? session.right / session.total : 0;
      sfx(rt >= 0.9 ? 'r3' : rt >= 0.7 ? 'r2' : 'r1');
    }
    if (view === 'gate') { var gi = $('#gateAns'); if (gi) gi.focus(); }
  }

  /* ---------- Ablauf ---------- */
  function startSession(mode) {
    var list = mode === 'map' ? selectedMaps() : selectedTerms();
    if (!list.length) return;
    var q = buildQueue(list, false), practice = false;
    if (!q.length) { q = buildQueue(list, true); practice = true; }
    session = { mode: mode, practice: practice, i: 0, right: 0, total: 0, q: q.map(function (it) { return makeEntry(it, mode); }), phase: 'ask', res: null };
    session.phase = session.q[0].kind === 'cards' ? 'front' : 'ask';
    view = 'session'; render();
  }

  function startTest() {
    var pool = shuffle(selectedTerms().concat(selectedMaps())).slice(0, TEST_SIZE);
    if (!pool.length) return;
    session = { mode: 'test', test: true, practice: false, i: 0, right: 0, total: 0, wrong: [], q: pool.map(function (it) { return makeEntry(it, 'quiz'); }), phase: 'ask', res: null };
    view = 'session'; render();
  }

  function record(ok) {
    var s = session, e = s.q[s.i], it = e.it;
    if (e.retry) return;
    s.total++; if (ok) s.right++;
    sfx(ok ? 'ok' : 'bad');
    if (s.test) { if (!ok) s.wrong.push(it); return; }
    if (!s.practice) {
      var P = prog(), c = P.cards[it.id] || { box: 1, due: 0, right: 0, wrong: 0 };
      if (ok) { c.box = Math.min(5, c.box + 1); c.right++; } else { c.box = 1; c.wrong++; }
      c.due = dueTs(INTERVALS[c.box]);
      P.cards[it.id] = c;
      var k = dayKey(new Date()); P.days[k] = (P.days[k] || 0) + 1;
      save();
    }
    if (!ok) { var again = makeEntry(it, s.mode); again.retry = true; s.q.push(again); }
  }

  function nextItem() {
    var s = session; clearTimeout(s.timer); s.i++;
    if (s.i >= s.q.length) { view = 'result'; render(); return; }
    s.phase = s.q[s.i].kind === 'cards' ? 'front' : 'ask'; s.res = null; render();
  }
  function autoNext(ok) {
    var s = session, at = s.i;
    clearTimeout(s.timer);
    if (!ok) return;
    s.timer = setTimeout(function () { if (view === 'session' && session === s && s.phase === 'result' && s.i === at) nextItem(); }, 1100);
  }

  function keepScroll() { var y = 0; try { y = window.scrollY; } catch (e) {} render(); try { window.scrollTo(0, y); } catch (e) {} }
  function newGate() { gate = { a: 6 + Math.floor(Math.random() * 4), b: 6 + Math.floor(Math.random() * 4) }; }
  function afterPick() { petSel = null; view = 'home'; }
  var act = {
    pick: function (d) { pid = d.id; DB.device = d.id; save(); afterPick(); render(); },
    'pet-sel': function (d) { petSel = d.k; keepScroll(); },
    'pet-ok': function () { if (!petSel) return; var P = prog(); P.pet = petSel; P.seen = petStage(); save(); view = 'home'; render(); },
    'lvl-ok': function () { var P = prog(); P.seen = petStage(); save(); render(); },
    snd: function () { DB.settings.sound = !soundOn(); save(); if (soundOn()) sfx('ok'); keepScroll(); },
    'pet-change': function (d) { var P = DB.prog[d.id]; if (P) { delete P.pet; P.seen = 0; save(); } render(); },
    'set-device': function (d) { DB.device = d.id; save(); render(); },
    parents: function () { newGate(); gateMsg = ''; resetFor = null; view = 'gate'; render(); },
    'gate-ok': function () { act.gateCheck(); },
    gateCheck: function () {
      var inp = $('#gateAns'), v = inp ? parseInt(inp.value, 10) : NaN;
      if (v === gate.a * gate.b) { resetFor = null; view = 'parents'; render(); }
      else { newGate(); gateMsg = 'Das stimmt leider nicht. Probiere es noch einmal.'; render(); }
    },
    quit: function () {
      if (session) clearTimeout(session.timer);
      if (view === 'parents' || view === 'gate') view = (pid && DB.device) ? 'home' : 'profiles';
      else view = 'home';
      render();
    },
    'start-test': function () { startTest(); },
    start: function (d) { startSession(d.m); },
    'chap-all': function () {
      var keys = allKeys(), allOn = keys.every(chapOn);
      DB.settings.off = allOn ? keys : [];
      save(); keepScroll();
    },
    flip: function () { session.phase = 'back'; render(); },
    know: function () { record(true); nextItem(); },
    again: function () { record(false); nextItem(); },
    'pick-opt': function (d) {
      var s = session, i = +d.i, e = s.q[s.i];
      if (s.phase !== 'ask') return;
      var ok = !!e.opts[i].ok;
      s.res = { idx: i }; s.phase = 'result'; record(ok); render(); autoNext(ok);
    },
    'map-tap': function (d) {
      var s = session, e = s.q[s.i];
      if (!s || s.phase !== 'ask' || e.kind !== 'tap') return;
      var ok = d.id === e.it.id;
      s.res = { id: d.id }; s.phase = 'result'; record(ok); render(); autoNext(ok);
    },
    next: function () { nextItem(); },
    reset: function (d) { resetFor = d.id; render(); },
    'reset-no': function () { resetFor = null; render(); },
    'reset-yes': function (d) { var old = DB.prog[d.id] || {}; DB.prog[d.id] = { cards: {}, days: {}, pet: old.pet, seen: 0 }; save(); resetFor = null; render(); }
  };

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-a]'); if (!t || t.disabled) return;
    var f = act[t.dataset.a]; if (f) f(t.dataset);
  });
  document.addEventListener('submit', function (e) {
    e.preventDefault();
    if (e.target.id === 'gateForm') act.gateCheck();
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.dataset && t.dataset.name) {
      var pr = DB.profiles.find(function (x) { return x.id === t.dataset.name; }), v = t.value.trim();
      if (pr && v) { pr.name = v.slice(0, 20); save(); }
    }
    if (t.dataset && t.dataset.chap) {
      var off = (DB.settings.off || []).filter(function (k) { return k !== t.dataset.chap; });
      if (!t.checked) off.push(t.dataset.chap);
      DB.settings.off = off; save(); keepScroll();
    }
    if (t.id === 'sndToggle') { DB.settings.sound = t.checked; save(); if (t.checked) sfx('ok'); }
  });

  if (DB.device && DB.profiles.some(function (p) { return p.id === DB.device; })) { pid = DB.device; afterPick(); }
  render();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
})();
</script>
</body>
</html>
